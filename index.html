<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaptenens Kontroller - Coriolis</title>
    <style>
        body {
            background-color: #000;
            color: #FF8C00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .screen {
            border: 2px solid #FF8C00;
            border-radius: 5px;
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }
        
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 140, 0, 0.2);
            animation: scanline 3s linear infinite;
            pointer-events: none;
        }
        
        @keyframes scanline {
            0% {
                top: 0;
            }
            100% {
                top: 100%;
            }
        }
        
        .flicker {
            animation: flicker 0.3s infinite alternate;
        }
        
        @keyframes flicker {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0.8;
            }
        }
        
        .header {
            text-align: center;
            border-bottom: 1px solid #FF8C00;
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .menu-item {
            margin: 15px 0;
            padding: 10px 15px;
            border: 1px solid #FF8C00;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .menu-item:hover {
            background-color: rgba(255, 140, 0, 0.2);
        }
        
        .menu-number {
            display: inline-block;
            width: 30px;
        }
        
        .status-bar {
            margin-top: 20px;
            border-top: 1px solid #FF8C00;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .cursor {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .output {
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed #FF8C00;
            min-height: 100px;
            display: none;
        }
        
        .crt-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.2;
        }
        
        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #FF8C00;
            background: none;
            border: 1px solid #FF8C00;
            padding: 5px 8px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            z-index: 20;
        }
        
        .sound-toggle:hover {
            background-color: rgba(255, 140, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="screen">
        <div class="scanline"></div>
        <div class="crt-effect"></div>
        <button class="sound-toggle" onclick="toggleSound()">LJUD: PÅ</button>
        
        <div class="header">
            <span class="flicker">KAPTENENS</span> KONTROLLER - RSS <span class="flicker">HOPPETS</span> STJÄRNA
        </div>
        
        <div class="menu">
            <div class="menu-item" onclick="selectOption(1)" onmouseover="playHoverSound()">
                <span class="menu-number">1.</span> STARTA ALLA SYSTEM
            </div>
            <div class="menu-item" onclick="selectOption(2)" onmouseover="playHoverSound()">
                <span class="menu-number">2.</span> SYSTEMKONTROLL
            </div>
            <div class="menu-item" onclick="selectOption(3)" onmouseover="playHoverSound()">
                <span class="menu-number">3.</span> PARKERINGSLÄGE
            </div>
            <div class="menu-item" onclick="selectOption(4)" onmouseover="playHoverSound()">
                <span class="menu-number">4.</span> AKTIVERA DATADJINN
            </div>
            <div class="menu-item" onclick="selectOption(5)" onmouseover="playHoverSound()">
                <span class="menu-number">5.</span> NAVIGATIONSKONTROLL
            </div>
            <div class="menu-item" onclick="selectOption(6)" onmouseover="playHoverSound()">
                <span class="menu-number">6.</span> LAST OCH LOGISTIK
            </div>
        </div>
        
        <div class="output" id="outputArea">
            Väntar på input... <span class="cursor">_</span>
        </div>
        
        <div class="status-bar">
            <div>STATUS: DOCKAD VID KUA STATION</div>
            <div>BRÄNSLE: 87%</div>
            <div>BIRR: 15,425</div>
            <div>SYSTEMTID: <span id="systemTime">372.15.89</span></div>
        </div>
    </div>
    
    <!-- Ljudeffekter -->
    <audio id="hoverSound" preload="auto">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA/+M4wAAAAAAAAAAAAEluZm8AAAAPAAAAAwAAAbAAkJCQkJCQkJCQkJCQkJCQkJCQwMDAwMDAwMDAwMDAwMDAwMDA4ODg4ODg4ODg4ODg4ODg4ODg//////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAXwAAAAAAAAAbBnC6KKAAAAAAD/+9DEAAAJtAF99BAAJeLE8H89gAFZmZmZmZmZmZmZmZmZmZlIn5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eX/+xDEGIPAAAGkAAAAIAAANIAAAASl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eXl5eX" type="audio/mp3">
    </audio>
    <audio id="clickSound" preload="auto">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA/+M4wAAAAAAAAAAAAEluZm8AAAAPAAAABAAAAeAAMDAwMDAwMDAwMDAwVVVVVVVVVVVVVVVVVVVVfX19fX19fX19fX19fX19fpqampqampqampqampqamsvLy8vLy8vLy8vLy8vLy////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAxgAAAAAAAAAfCjZ3zYAAAAAAD/+8DEAAAImATvnnnAAjLLvzvPMCJERERERERERERERERERET/TTTMzMzMzMzMYAAAAVVVVVPzNVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV/+yDE0QPgAAGkAAAAIAAANIAAAARVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQ==" type="audio/mp3">
    </audio>
    <audio id="typeSound" preload="auto">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA/+M4wAAAAAAAAAAAAEluZm8AAAAPAAAABAAABIAAQEBAQEBAQEBAQEBgYGBgYGBgYGBgYGBggICAgICAgICAgICAgKCgoKCgoKCgoKCgoKDAwMDAwMDAwMDAwMDg4ODg4ODg4ODg4ODg//////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAVYAAAAAAAABIBI2e9TAAAAAAD/+8DEAAAJfEF59BAAKYYLH/cwgAIWZmZmZmWiIiJzmzmZqszMzERETMREREREzMzMzMzMzMzMzMzMRERETMzMzMxo5mXkRERERERETIiMzMzMzMzMzMxMzMzMiIiIiIjIiIiIiIiIiMzMzMREROTMTMzOZmYmdiJmZmTMzNzMzMRMRERMxEREzEzMRERERERERERERERERERERERERERERERERERERERERERERERE/+vDECIPAAAGkAAAAIAAANIAAAARERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERETEVUxBTUUzLjEwMC4xMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV" type="audio/mp3">
    </audio>
    
    <script>
        let soundEnabled = true;
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.querySelector('.sound-toggle').textContent = soundEnabled ? "LJUD: PÅ" : "LJUD: AV";
        }
        
        function playHoverSound() {
            if (soundEnabled) {
                document.getElementById('hoverSound').currentTime = 0;
                document.getElementById('hoverSound').play();
            }
        }
        
        function playClickSound() {
            if (soundEnabled) {
                document.getElementById('clickSound').currentTime = 0;
                document.getElementById('clickSound').play();
            }
        }
        
        function playTypeSound() {
            if (soundEnabled) {
                document.getElementById('typeSound').currentTime = 0;
                document.getElementById('typeSound').play();
            }
        }
        
        // Simulera en terminal-effekt med ljud
        function typeText(elementId, text, speed) {
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            element.style.display = "block";
            
            let i = 0;
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    if (text.charAt(i-1) !== ' ' && text.charAt(i-1) !== '\n') {
                        playTypeSound();
                    }
                    setTimeout(typing, speed);
                } else {
                    element.innerHTML += "<span class='cursor'>_</span>";
                }
            }
            
            typing();
        }
        
        function selectOption(option) {
            playClickSound();
            let outputText = "";
            
            switch(option) {
                case 1:
                    outputText = "> INITIERAR SYSTEMUPPSTART...\n\n" +
                                "REAKTOR.............. ONLINE\n" +
                                "LIVSSYSTEM........... ONLINE\n" +
                                "NAVIGATION........... ONLINE\n" +
                                "KOMMUNIKATION........ ONLINE\n" +
                                "SENSORER............. ONLINE\n\n" +
                                "SKEPPET ÄR REDO FÖR AVFÄRD";
                    break;
                case 2:
                    outputText = "> GENOMFÖR SYSTEMKONTROLL...\n\n" +
                                "SKEPPSSKROV.......... 92%\n" +
                                "ENERGISYSTEM......... 100%\n" +
                                "VAPENSYSTEM.......... 75%\n" +
                                "SKÖLDAR.............. 100%\n" +
                                "ATMOSFÄR............. NORMAL\n\n" +
                                "ALLA SYSTEM FUNGERAR INOM TOLERANSGRÄNSER";
                    break;
                case 3:
                    outputText = "> AKTIVERAR PARKERINGSLÄGE...\n\n" +
                                "STÄNGER AV HUVUDMOTOR\n" +
                                "AKTIVERAR DOCKNINGSKLAMP\n" +
                                "MINIMERAR ENERGIFÖRBRUKNING\n\n" +
                                "PARKERINGSLÄGE AKTIVERAT";
                    break;
                case 4:
                    outputText = "> AKTIVERAR DATADJINN...\n\n" +
                                "ETABLERAR KONTAKT MED PORTALSFÄREN\n" +
                                "LADDAR AI-PROTOKOLL\n" +
                                "KONFIGURERAR DATADJINN-GRÄNSSNITT\n\n" +
                                "DATADJINN ONLINE: \"Jag är redo att tjäna, Kapten.\"";
                    break;
                case 5:
                    outputText = "> ÖPPNAR NAVIGATIONSKONTROLL...\n\n" +
                                "NUVARANDE POSITION: KUA SYSTEM\n" +
                                "NÄRMASTE PORTALER:\n" +
                                "- DABARAN (2.3 PARSEC)\n" +
                                "- ALGOL (3.7 PARSEC)\n" +
                                "- ZALOS (3.9 PARSEC)\n\n" +
                                "BERÄKNA KURS FÖR SPECIFIK DESTINATION...";
                    break;
                case 6:
                    outputText = "> LASTÖVERSIKT...\n\n" +
                                "KAPACITET: 14/40 TON\n" +
                                "MEDICIN (UPPDRAG): 10 TON\n" +
                                "TEKNOLOGI: 2 TON\n" +
                                "KRYDDOR: 2 TON\n\n" +
                                "UPPDRAG: LEVERERA MEDICIN TILL DABARAN-STATIONEN";
                    break;
                default:
                    outputText = "KOMMANDO OKÄNT";
            }
            
            typeText("outputArea", outputText, 20);
        }
        
        // Uppdatera systemtid
        setInterval(function() {
            const timeElement = document.getElementById("systemTime");
            const currentTime = timeElement.textContent;
            const [cycle, period, tick] = currentTime.split(".");
            
            let newTick = parseInt(tick) + 1;
            let newPeriod = parseInt(period);
            let newCycle = parseInt(cycle);
            
            if (newTick > 99) {
                newTick = 0;
                newPeriod += 1;
            }
            
            if (newPeriod > 20) {
                newPeriod = 1;
                newCycle += 1;
            }
            
            timeElement.textContent = `${newCycle}.${newPeriod < 10 ? '0' + newPeriod : newPeriod}.${newTick < 10 ? '0' + newTick : newTick}`;
        }, 2000);
    </script>
</body>
</html>
